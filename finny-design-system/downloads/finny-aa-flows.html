<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Finny AA Flows</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/*
 * Finny design tokens — CSS custom properties + base component styles.
 * Source of truth: tokens.json. Keep both in sync.
 * Requires Poppins (400, 500, 600, 700):
 *   <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
 */

:root {
  /* ---------- Primitive: colour ---------- */
  --fy-primary-600: #02372F;
  --fy-primary-500: #1B4B44;
  --fy-primary-400: #03685A;
  --fy-primary-300: #4E736E;
  --fy-primary-200: #678782;
  --fy-primary-100: #9AAFAC;

  --fy-neutral-600: #01231E;
  --fy-neutral-500: #576361;
  --fy-neutral-400: #909D9B;
  --fy-neutral-300: #CCD7D5;
  --fy-neutral-200: #E6EBEA;
  --fy-neutral-100: #F5F7F7;
  --fy-white:       #FFFFFF;

  --fy-success-700: #236B42;
  --fy-success-600: #4C9B66;
  --fy-success-100: #CCE6D4;
  --fy-success-50:  #EEF7F1;
  --fy-error-700:   #B4475B;
  --fy-error-600:   #C85267;
  --fy-error-50:    #F9ECEE;
  --fy-warning-700: #9A6531;
  --fy-warning-600: #C88A52;
  --fy-warning-50:  #F9F2EC;
  --fy-cream-50:  #F5F6F0;

  /* Category tints: the left fill on breakdown rows (cashflow, expenses) */
  --fy-tint-spends:     #EAD8E2;
  --fy-tint-investment: #CBCDE5;
  --fy-tint-loans:      #E4E3CC;
  --fy-tint-untagged:   #DFDFDF;
  --fy-tint-surplus:    #C0DFCA;
  --fy-tint-shortfall:  #FCCBCC;

  /* FIRE dark theme (FIRE age result screens) */
  --fy-fire-bg:     #1C2518;
  --fy-fire-accent: var(--fy-warning-600);

  --fy-gradient-green: linear-gradient(94deg, #1F673F 1.66%, #57A870 149.87%);
  --fy-gradient-teal:  linear-gradient(100deg, #205558 0%, #166159 100%);

  /* ---------- Primitive: type ---------- */
  --fy-font: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --fy-weight-regular: 400;
  --fy-weight-medium: 500;
  --fy-weight-semibold: 600;
  --fy-weight-bold: 700;
  --fy-lh-tight: 1.25;
  --fy-lh-snug: 1.4;
  --fy-lh-normal: 1.5;

  /* ---------- Primitive: space / radius / shadow ---------- */
  --fy-space-0: 0px;
  --fy-space-1: 4px;
  --fy-space-2: 8px;
  --fy-space-3: 12px;
  --fy-space-4: 16px;
  --fy-space-5: 20px;
  --fy-space-6: 24px;
  --fy-space-8: 32px;
  --fy-space-10: 40px;
  --fy-space-12: 48px;

  --fy-radius-xs: 4px;
  --fy-radius-sm: 8px;
  --fy-radius-md: 12px;
  --fy-radius-lg: 16px;
  --fy-radius-pill: 999px;

  --fy-shadow-card: 0 3px 15px rgba(212, 212, 212, 0.5);        /* Figma effect "Card Shadow light" */
  --fy-shadow-card-strong: 0 3px 15px #D4D4D4;                 /* Figma effect "Card shadow" */
  --fy-shadow-row: 0 4px 5px rgba(178, 178, 178, 0.24);         /* option rows in login flows */
  --fy-shadow-raised: 0 4px 12px rgba(1, 35, 30, 0.12);
  --fy-shadow-panel: 0 -6px 24px #E6EBEA;
  --fy-scrim: rgba(0, 15, 13, 0.9);

  /* ---------- Semantic: colour ---------- */
  --fy-bg-canvas:  var(--fy-cream-50);    /* screen background */
  --fy-bg-page:    var(--fy-cream-50);    /* intermediate screens match main pages */
  --fy-bg-surface: var(--fy-white);
  --fy-bg-subtle:  var(--fy-neutral-100);
  --fy-bg-muted:   var(--fy-neutral-200);
  --fy-bg-inverse: var(--fy-neutral-600);
  --fy-bg-brand:   var(--fy-success-600);

  --fy-text-display:     var(--fy-primary-400);
  --fy-text-heading:     var(--fy-primary-500);
  --fy-text-primary:     var(--fy-neutral-600);
  --fy-text-secondary:   var(--fy-neutral-500);
  --fy-text-placeholder: var(--fy-neutral-400);
  --fy-text-disabled:    var(--fy-primary-100);
  --fy-text-inverse:     var(--fy-white);
  --fy-text-link:        var(--fy-success-700);
  --fy-text-muted:       var(--fy-primary-300);
  --fy-text-brand:       var(--fy-success-700);

  --fy-border-default: var(--fy-neutral-300);
  --fy-border-subtle:  var(--fy-neutral-200);
  --fy-border-strong:  var(--fy-primary-100);
  --fy-border-focus:   var(--fy-success-600);

  --fy-success:        var(--fy-success-600);
  --fy-success-text:   var(--fy-success-700);
  --fy-success-subtle: var(--fy-success-50);
  --fy-error:          var(--fy-error-600);
  --fy-error-text:     var(--fy-error-700);
  --fy-error-subtle:   var(--fy-error-50);
  --fy-warning:        var(--fy-warning-600);
  --fy-warning-text:   var(--fy-warning-700);
  --fy-gain: var(--fy-success-700);   /* positive amounts and returns */
  --fy-loss: var(--fy-error-700);     /* negative amounts and returns */
  --fy-warning-subtle: var(--fy-warning-50);

  /* ---------- Component ---------- */
  --fy-button-height: 48px;
  --fy-button-secondary-border: var(--fy-success-700);
  --fy-input-height: 40px;
  --fy-chip-height: 40px;
}

/* ---------- Typography ---------- */
.fy-heading-1    { font: var(--fy-weight-bold)     32px/var(--fy-lh-tight)  var(--fy-font); }
.fy-heading-2    { font: var(--fy-weight-semibold) 28px/var(--fy-lh-tight)  var(--fy-font); }
.fy-heading-3    { font: var(--fy-weight-semibold) 24px/28px var(--fy-font); letter-spacing: .01em; }
.fy-subheading-1 { font: var(--fy-weight-semibold) 20px/var(--fy-lh-snug)   var(--fy-font); }
.fy-subtitle-1   { font: var(--fy-weight-semibold) 16px/22px var(--fy-font); letter-spacing: .01em; }
.fy-subtitle-2   { font: var(--fy-weight-medium)   16px/22px var(--fy-font); letter-spacing: .01em; }
.fy-body-1       { font: var(--fy-weight-medium)   14px/22px var(--fy-font); letter-spacing: .01em; }
.fy-body-2       { font: var(--fy-weight-regular)  14px/22px var(--fy-font); letter-spacing: .01em; }
.fy-subtitle-3   { font: var(--fy-weight-medium)   12px/var(--fy-lh-normal) var(--fy-font); }
.fy-caption      { font: var(--fy-weight-regular)  10px/var(--fy-lh-normal) var(--fy-font); }

/* ---------- Buttons ---------- */
.fy-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--fy-space-2);
  width: 100%; height: var(--fy-button-height); padding: 0 var(--fy-space-4);
  border: 1px solid transparent; border-radius: var(--fy-radius-sm);
  font: var(--fy-weight-semibold) 16px/1 var(--fy-font);
  cursor: pointer; transition: filter .15s, box-shadow .15s;
}
.fy-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--fy-success-100); }
.fy-btn--primary   { background: var(--fy-gradient-green); color: var(--fy-text-inverse); }
.fy-btn--primary:hover { filter: brightness(1.06); }
.fy-btn--secondary { background: var(--fy-bg-surface); border-color: var(--fy-button-secondary-border); color: var(--fy-text-brand); }
.fy-btn--secondary:hover { background: var(--fy-success-subtle); }
.fy-btn--danger    { background: var(--fy-error); color: var(--fy-text-inverse); }
.fy-btn--danger-outline { background: var(--fy-bg-surface); border-color: var(--fy-error); color: var(--fy-error-text); }
.fy-btn--text {
  width: auto; height: auto; padding: var(--fy-space-1); background: none;
  font: var(--fy-weight-medium) 12px/var(--fy-lh-normal) var(--fy-font);
  color: var(--fy-text-link); text-decoration: underline; text-underline-offset: 2px;
}
.fy-btn--primary:disabled,
.fy-btn--danger:disabled  { background: var(--fy-bg-muted); color: var(--fy-text-disabled); cursor: not-allowed; filter: none; }
.fy-btn--secondary:disabled,
.fy-btn--danger-outline:disabled { background: var(--fy-bg-surface); border-color: var(--fy-border-strong); color: var(--fy-text-disabled); cursor: not-allowed; }
.fy-btn[aria-busy="true"] { pointer-events: none; }
.fy-spinner {
  width: 14px; height: 14px; border-radius: 50%;
  border: 1.5px solid currentColor; border-right-color: transparent;
  animation: fy-spin .8s linear infinite;
}
@keyframes fy-spin { to { transform: rotate(360deg); } }

/* ---------- Form fields ---------- */
.fy-field { display: flex; flex-direction: column; gap: var(--fy-space-2); min-width: 0; }
.fy-field__label  { font: var(--fy-weight-medium) 12px/var(--fy-lh-normal) var(--fy-font); color: var(--fy-text-primary); }
.fy-field__helper { font: var(--fy-weight-regular) 10px/var(--fy-lh-normal) var(--fy-font); color: var(--fy-text-secondary); margin-top: calc(var(--fy-space-1) * -1); }

.fy-input {
  display: flex; align-items: center; height: var(--fy-input-height);
  background: var(--fy-bg-surface); border: 1px solid var(--fy-border-default); border-radius: var(--fy-radius-sm);
  overflow: hidden; transition: border-color .15s, box-shadow .15s;
}
.fy-input:focus-within { border-color: var(--fy-border-focus); box-shadow: 0 0 0 3px var(--fy-success-subtle); }
.fy-input input, .fy-input select {
  flex: 1; width: 100%; min-width: 0; height: 100%; padding: 0 var(--fy-space-3);
  border: 0; background: transparent; outline: none; appearance: none;
  font: var(--fy-weight-regular) 14px/1 var(--fy-font); color: var(--fy-text-primary);
}
.fy-input input::placeholder { color: var(--fy-text-placeholder); }
.fy-input select:invalid { color: var(--fy-text-placeholder); }
.fy-input__prefix {
  display: grid; place-items: center; width: 32px; height: 100%;
  border-right: 1px solid var(--fy-border-default);
  font: var(--fy-weight-medium) 14px/1 var(--fy-font); color: var(--fy-text-primary);
}
.fy-input__chevron { margin-right: var(--fy-space-3); color: var(--fy-text-secondary); pointer-events: none; }
.fy-field--error .fy-input { border-color: var(--fy-error); }
.fy-field--error .fy-input:focus-within { box-shadow: 0 0 0 3px var(--fy-error-subtle); }
.fy-field--error .fy-input input,
.fy-field--error .fy-input input::placeholder,
.fy-field--error .fy-field__helper { color: var(--fy-error-text); }

/* ---------- Choice chips (Self / Spouse / Shared) ---------- */
.fy-choices { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: var(--fy-space-2); }
.fy-choice {
  height: var(--fy-chip-height); padding: 0 var(--fy-space-3);
  background: var(--fy-bg-surface); border: 1px solid var(--fy-border-default); border-radius: var(--fy-radius-sm);
  font: var(--fy-weight-regular) 14px/1 var(--fy-font); color: var(--fy-text-primary); cursor: pointer;
}
.fy-choice[aria-checked="true"] { background: var(--fy-success-subtle); border-color: var(--fy-success); }
.fy-choice:focus-visible { outline: 2px solid var(--fy-border-focus); outline-offset: 2px; }

/* ---------- Filter chips (All / Bank accounts / …) ---------- */
.fy-filter { display: flex; gap: var(--fy-space-2); overflow-x: auto; }
.fy-filter__chip {
  flex: none; height: 28px; padding: 0 var(--fy-space-2);
  background: var(--fy-bg-surface); border: 1px solid var(--fy-border-subtle); border-radius: var(--fy-radius-sm);
  font: var(--fy-weight-regular) 10px/1 var(--fy-font); color: var(--fy-text-secondary); cursor: pointer;
}
.fy-filter__chip[aria-pressed="true"] { background: var(--fy-bg-muted); border-color: var(--fy-bg-muted); font-weight: var(--fy-weight-semibold); font-size: 12px; color: var(--fy-text-primary); }

/* ---------- Segmented toggle (You / Spouse) ---------- */
.fy-segmented {
  display: inline-flex; padding: 3px; gap: 2px;
  background: var(--fy-bg-subtle); border-radius: var(--fy-radius-pill);
  box-shadow: inset 0 0 0 1px var(--fy-border-subtle);
}
.fy-segmented button {
  min-width: 88px; height: 28px; padding: 0 var(--fy-space-4); border: 0; border-radius: var(--fy-radius-pill);
  background: transparent; font: var(--fy-weight-medium) 12px/1 var(--fy-font); color: var(--fy-text-disabled); cursor: pointer;
}
.fy-segmented button[aria-pressed="true"] { background: var(--fy-gradient-teal); color: var(--fy-text-inverse); }

/* ---------- Cards & lists ---------- */
.fy-card { background: var(--fy-bg-surface); border-radius: var(--fy-radius-md); box-shadow: var(--fy-shadow-card); padding: var(--fy-space-4); }
.fy-card--dashed { box-shadow: none; border: 1px dashed var(--fy-border-default); }
.fy-list > * + * { border-top: 1px solid var(--fy-border-subtle); }

/* =====================================================================
 * App components — extracted from the Figma "Login flows" page
 * (login, OTP, account aggregator, errors, app update).
 * ===================================================================== */

/* ---------- Screen scaffolding ---------- */
.fy-screen {
  position: relative; display: flex; flex-direction: column; overflow: hidden;
  background: var(--fy-bg-page); color: var(--fy-text-primary); font-family: var(--fy-font);
}
.fy-screen--main { background: var(--fy-bg-canvas); }
.fy-appbar { display: flex; align-items: center; justify-content: space-between; min-height: 56px; padding: 0 var(--fy-space-2); }
.fy-icon-btn {
  display: inline-grid; place-items: center; width: 40px; height: 40px; padding: 0;
  border: 0; border-radius: var(--fy-radius-pill); background: transparent; color: var(--fy-text-heading); cursor: pointer;
}
.fy-icon-btn:hover { background: var(--fy-bg-muted); }
.fy-icon-btn:focus-visible { outline: 2px solid var(--fy-border-focus); outline-offset: 2px; }
.fy-icon-btn svg { width: 22px; height: 22px; }

/* Hero: big teal display title with an illustration slot. */
.fy-hero { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: var(--fy-space-3); padding: var(--fy-space-2) var(--fy-space-4) var(--fy-space-6); }
.fy-hero--stacked { grid-template-columns: 1fr; }
.fy-hero--center { grid-template-columns: 1fr; justify-items: center; text-align: center; }
.fy-hero__title { margin: 0; font: var(--fy-weight-bold) 32px/39px var(--fy-font); color: var(--fy-text-display); text-wrap: balance; }
.fy-hero__lede { margin: var(--fy-space-3) 0 0; font: var(--fy-weight-regular) 14px/1.5 var(--fy-font); color: var(--fy-text-heading); }

/* Panel: white surface that rises over the hero. */
.fy-panel {
  flex: 1; display: flex; flex-direction: column; gap: var(--fy-space-4);
  padding: var(--fy-space-6) var(--fy-space-4) var(--fy-space-4);
  background: var(--fy-bg-surface); border-radius: var(--fy-radius-lg) var(--fy-radius-lg) 0 0; box-shadow: var(--fy-shadow-panel);
}
.fy-panel__title { margin: 0; font: var(--fy-weight-semibold) 20px/1.3 var(--fy-font); color: var(--fy-text-heading); }
.fy-panel__sub   { margin: 4px 0 0; font: var(--fy-weight-regular) 12px/1.5 var(--fy-font); color: var(--fy-text-muted); }
.fy-actions { display: grid; gap: var(--fy-space-3); margin-top: auto; }

/* ---------- Bottom sheet ---------- */
.fy-scrim { position: absolute; inset: 0; display: flex; align-items: flex-end; background: var(--fy-scrim); }
.fy-sheet {
  position: relative; display: flex; flex-direction: column; width: 100%; max-height: 92%; overflow: auto;
  background: var(--fy-bg-surface); border-radius: var(--fy-radius-lg) var(--fy-radius-lg) 0 0;
}
.fy-sheet__head { display: grid; gap: var(--fy-space-2); padding: var(--fy-space-6) var(--fy-space-4) var(--fy-space-5); background: var(--fy-bg-canvas); }
.fy-sheet__head--center { justify-items: center; text-align: center; }
.fy-sheet__head--plain { background: var(--fy-bg-surface); }
.fy-sheet__close { position: absolute; top: var(--fy-space-2); right: var(--fy-space-2); color: var(--fy-text-muted); }
.fy-sheet__title { margin: 0; font: var(--fy-weight-bold) 24px/29px var(--fy-font); color: var(--fy-text-display); text-wrap: balance; }
.fy-sheet__sub   { margin: 0; font: var(--fy-weight-regular) 14px/1.5 var(--fy-font); color: var(--fy-text-muted); }
.fy-sheet__body {
  display: grid; gap: var(--fy-space-3); padding: var(--fy-space-5) var(--fy-space-4);
  background: var(--fy-bg-surface); border-radius: var(--fy-radius-lg) var(--fy-radius-lg) 0 0; margin-top: calc(var(--fy-space-3) * -1);
}
.fy-sheet__head--plain + .fy-sheet__body { margin-top: 0; }
.fy-sheet__foot { display: grid; gap: var(--fy-space-3); padding: var(--fy-space-2) var(--fy-space-4) var(--fy-space-4); }

/* Illustration slot: tinted disc that holds a 3D illustration or icon. */
.fy-art { display: grid; place-items: center; width: 88px; height: 88px; border-radius: 50%; background: var(--fy-bg-canvas); color: var(--fy-primary-400); }
.fy-art--sm { width: 56px; height: 56px; background: var(--fy-bg-surface); box-shadow: var(--fy-shadow-card); }
.fy-art--error { background: var(--fy-error-subtle); color: var(--fy-error); }
.fy-art--success { background: var(--fy-success-subtle); color: var(--fy-success-text); }
.fy-art svg { width: 44%; height: 44%; }

/* ---------- Phone number input ---------- */
.fy-phone { display: grid; grid-template-columns: 68px minmax(0, 1fr); gap: var(--fy-space-2); }
.fy-phone__country, .fy-phone__field {
  height: 48px; border: 1px solid transparent; border-radius: var(--fy-radius-sm); background: var(--fy-bg-subtle);
  transition: border-color .15s, background .15s;
}
.fy-phone__country { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0; cursor: pointer; color: var(--fy-text-heading); }
.fy-phone__field { display: flex; align-items: center; gap: var(--fy-space-2); padding: 0 var(--fy-space-3); }
.fy-phone__field:focus-within { border-color: var(--fy-border-focus); background: var(--fy-bg-surface); }
.fy-phone__code, .fy-phone__field input {
  font: var(--fy-weight-semibold) 16px/1 var(--fy-font); letter-spacing: .04em; color: var(--fy-text-heading);
}
.fy-phone__field input { flex: 1; min-width: 0; width: 100%; height: 100%; border: 0; padding: 0; background: transparent; outline: none; }
.fy-phone__field input::placeholder { font-weight: var(--fy-weight-regular); font-size: 12px; letter-spacing: 0; color: var(--fy-text-placeholder); }
.fy-flag { width: 27px; height: 20px; border-radius: 3px; overflow: hidden; flex: none; box-shadow: 0 0 0 1px var(--fy-border-subtle); }

/* ---------- OTP input ---------- */
.fy-otp { display: grid; grid-template-columns: repeat(6, 40px); justify-content: space-between; gap: var(--fy-space-2); }
.fy-otp__cell {
  width: 40px; height: 48px; padding: 0; border: 0; border-bottom: 1px solid var(--fy-border-default); border-radius: 0;
  background: transparent; text-align: center; outline: none;
  font: var(--fy-weight-semibold) 24px/1 var(--fy-font); letter-spacing: .04em; color: var(--fy-text-heading);
  caret-color: var(--fy-primary-400);
}
.fy-otp__cell:not(:placeholder-shown) { border-bottom-color: var(--fy-primary-400); }
.fy-otp__cell:focus { border-bottom: 2px solid var(--fy-primary-400); }
.fy-otp--error .fy-otp__cell { color: var(--fy-error-text); border-bottom-color: var(--fy-error); }
.fy-field-error { margin: 0; font: var(--fy-weight-regular) 12px/1.5 var(--fy-font); color: var(--fy-error-text); }

/* Small inline tag, e.g. "edit" next to the phone number. */
.fy-tag {
  display: inline-flex; align-items: center; padding: 2px 6px; border: 0; border-radius: var(--fy-radius-pill);
  background: var(--fy-bg-canvas); font: var(--fy-weight-regular) 12px/16px var(--fy-font); color: var(--fy-text-heading); cursor: pointer;
}
.fy-recipient { display: flex; align-items: center; gap: 6px; font: var(--fy-weight-medium) 14px/1.4 var(--fy-font); color: var(--fy-text-heading); }

/* Resend countdown line. */
.fy-timer { margin: 0; font: var(--fy-weight-medium) 14px/1.4 var(--fy-font); color: var(--fy-text-heading); }
.fy-timer b { font-weight: var(--fy-weight-bold); font-variant-numeric: tabular-nums; }

/* Status pill: background progress or a completed step. */
.fy-status-pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: var(--fy-radius-pill);
  background: var(--fy-success-subtle); font: var(--fy-weight-medium) 12px/1.4 var(--fy-font); color: var(--fy-text-heading);
}
.fy-status-pill .fy-spinner { width: 12px; height: 12px; color: var(--fy-success-text); }
.fy-status-pill svg { width: 14px; height: 14px; color: var(--fy-success); }

/* Resend channel chips (SMS / Call / WhatsApp). */
.fy-channels { display: flex; flex-wrap: wrap; gap: var(--fy-space-3); }
.fy-channel {
  display: inline-flex; align-items: center; gap: 4px; padding: 6px 10px;
  border: 1px solid var(--fy-primary-200); border-radius: var(--fy-radius-pill); background: var(--fy-bg-subtle);
  font: var(--fy-weight-medium) 12px/1.4 var(--fy-font); color: var(--fy-text-heading); cursor: pointer;
}
.fy-channel svg { width: 16px; height: 16px; }
.fy-channel:hover { background: var(--fy-success-subtle); }
.fy-channel:focus-visible { outline: 2px solid var(--fy-border-focus); outline-offset: 2px; }
.fy-label { margin: 0; font: var(--fy-weight-medium) 14px/1.5 var(--fy-font); color: var(--fy-text-heading); }

/* ---------- Option row (tappable list card) ---------- */
.fy-option {
  display: flex; align-items: center; gap: 10px; width: 100%; min-height: 54px; padding: 8px 10px 8px 16px;
  border: 1px solid var(--fy-border-subtle); border-radius: var(--fy-radius-md); background: var(--fy-bg-surface); box-shadow: var(--fy-shadow-row);
  font: var(--fy-weight-semibold) 16px/1.3 var(--fy-font); letter-spacing: .04em; color: var(--fy-text-heading); text-align: left; cursor: pointer;
}
.fy-option__label { flex: 1; min-width: 0; }
.fy-option__trail { display: inline-flex; align-items: center; gap: 14px; color: var(--fy-text-heading); }
.fy-option__trail > svg { width: 20px; height: 20px; }
.fy-option--plain { font-weight: var(--fy-weight-medium); letter-spacing: 0; color: var(--fy-text-primary); }
.fy-option:focus-visible { outline: 2px solid var(--fy-border-focus); outline-offset: 2px; }

/* ---------- Account group (accordion card) ---------- */
.fy-group { border: 1px solid var(--fy-border-subtle); border-radius: var(--fy-radius-md); background: var(--fy-bg-surface); box-shadow: var(--fy-shadow-card); }
.fy-group > summary {
  display: flex; align-items: center; gap: 10px; min-height: 54px; padding: 8px 14px 8px 16px; list-style: none; cursor: pointer;
  font: var(--fy-weight-medium) 16px/1.3 var(--fy-font); color: var(--fy-text-primary);
}
.fy-group > summary::-webkit-details-marker { display: none; }
.fy-group > summary .fy-chevron { margin-left: auto; transition: transform .2s; }
.fy-group[open] > summary .fy-chevron { transform: rotate(180deg); }
.fy-group__icon { display: grid; place-items: center; width: 28px; height: 28px; color: var(--fy-success); flex: none; }
.fy-group__icon svg { width: 20px; height: 20px; }
.fy-group__body { display: grid; gap: var(--fy-space-4); margin: 0 var(--fy-space-4); padding: var(--fy-space-4) 0 var(--fy-space-3) var(--fy-space-3); border-top: 1px dashed var(--fy-border-default); }
.fy-group__more { justify-self: center; padding: 4px; border: 0; background: none; font: var(--fy-weight-semibold) 12px/1.4 var(--fy-font); color: var(--fy-text-link); cursor: pointer; }
.fy-chevron { width: 20px; height: 20px; flex: none; color: var(--fy-text-heading); }

/* Account row inside a group. */
.fy-account { display: flex; align-items: center; gap: var(--fy-space-2); }
.fy-account__text { display: grid; gap: 2px; min-width: 0; }
.fy-account__name { font: var(--fy-weight-medium) 12px/1.4 var(--fy-font); color: var(--fy-text-primary); }
.fy-account__meta { font: var(--fy-weight-regular) 10px/1.4 var(--fy-font); color: var(--fy-text-secondary); font-variant-numeric: tabular-nums; }
.fy-account .fy-check { margin-left: auto; }
.fy-logo {
  display: grid; place-items: center; width: 36px; height: 36px; flex: none; border-radius: 50%;
  border: 1px solid var(--fy-border-subtle); background: var(--fy-bg-surface);
  font: var(--fy-weight-bold) 11px/1 var(--fy-font); color: var(--fy-text-heading);
}
.fy-logo--sm { width: 20px; height: 20px; font-size: 7px; border-color: #B2BBC6; }
.fy-logo-stack { display: inline-flex; }
.fy-logo-stack > * + * { margin-left: -8px; }

/* Selection badge. */
.fy-check { display: grid; place-items: center; width: 20px; height: 20px; flex: none; border-radius: 50%; background: var(--fy-primary-400); color: #fff; }
.fy-check svg { width: 11px; height: 11px; }
.fy-check--off { background: transparent; box-shadow: inset 0 0 0 1.5px var(--fy-border-default); }
.fy-check--off svg { visibility: hidden; }

/* ---------- Trust / feature list ---------- */
.fy-features { display: grid; gap: var(--fy-space-4); margin: 0; padding: 0; list-style: none; }
.fy-features li { display: flex; align-items: center; gap: 11px; font: var(--fy-weight-regular) 14px/1.4 var(--fy-font); color: var(--fy-text-heading); }
.fy-features__icon { display: grid; place-items: center; width: 34px; height: 34px; flex: none; border-radius: 50%; background: var(--fy-success-subtle); color: var(--fy-success-text); }
.fy-features__icon svg { width: 18px; height: 18px; }

/* ---------- FAQ accordion ---------- */
.fy-faq { display: grid; gap: var(--fy-space-1); }
.fy-faq details { border-bottom: 1px solid var(--fy-border-subtle); }
.fy-faq details[open] { border-bottom-color: transparent; }
.fy-faq summary {
  display: flex; align-items: center; justify-content: space-between; gap: var(--fy-space-3); padding: 12px 0; list-style: none; cursor: pointer;
  font: var(--fy-weight-medium) 14px/1.4 var(--fy-font); color: var(--fy-text-heading);
}
.fy-faq summary::-webkit-details-marker { display: none; }
.fy-faq summary .fy-chevron { width: 16px; height: 16px; transition: transform .2s; }
.fy-faq details[open] summary .fy-chevron { transform: rotate(180deg); }
.fy-faq__answer { display: grid; gap: var(--fy-space-3); margin-bottom: var(--fy-space-2); padding: 12px; border-radius: var(--fy-radius-sm); background: var(--fy-bg-canvas); }
.fy-faq__answer p { margin: 0; font: var(--fy-weight-medium) 12px/25px var(--fy-font); color: var(--fy-text-muted); }

/* Video card (thumbnail + title + duration). */
.fy-video { display: flex; align-items: center; gap: var(--fy-space-3); padding: 12px 8px 12px 12px; border-radius: var(--fy-radius-sm); background: var(--fy-bg-surface); color: inherit; text-decoration: none; }
.fy-video__thumb { position: relative; display: grid; place-items: center; width: 68px; height: 44px; flex: none; border-radius: var(--fy-radius-xs); background: linear-gradient(135deg, #0B2A3A, #164E5C); color: #fff; }
.fy-video__thumb svg { width: 20px; height: 20px; }
.fy-video__text { flex: 1; min-width: 0; display: grid; }
.fy-video__title { font: var(--fy-weight-medium) 12px/16px var(--fy-font); color: var(--fy-text-primary); }
.fy-video__time { font: var(--fy-weight-regular) 10px/20px var(--fy-font); color: var(--fy-text-secondary); font-variant-numeric: tabular-nums; }

/* ---------- Stat tiles (consent terms) ---------- */
.fy-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--fy-space-2); }
.fy-stat { display: grid; padding: var(--fy-space-2); border-radius: var(--fy-radius-sm); background: var(--fy-bg-subtle); text-align: center; }
.fy-stat__label { font: var(--fy-weight-regular) 10px/1.4 var(--fy-font); color: var(--fy-text-muted); }
.fy-stat__value { font: var(--fy-weight-semibold) 12px/22px var(--fy-font); color: var(--fy-primary-600); }

/* ---------- Status block (error / info / waiting / update) ---------- */
.fy-status { display: grid; justify-items: center; gap: var(--fy-space-2); padding: var(--fy-space-6) var(--fy-space-6) var(--fy-space-4); text-align: center; }
.fy-status--start { justify-items: start; text-align: left; }
.fy-status__title { margin: var(--fy-space-3) 0 0; font: var(--fy-weight-bold) 24px/1.25 var(--fy-font); color: var(--fy-text-heading); text-wrap: balance; }
.fy-status--display .fy-status__title { font-size: 32px; line-height: 39px; color: var(--fy-text-display); }
.fy-status__body { margin: 0; max-width: 32ch; font: var(--fy-weight-regular) 14px/1.6 var(--fy-font); color: var(--fy-text-heading); }
.fy-status__body b { font-weight: var(--fy-weight-semibold); }

/* ---------- Small print ---------- */
.fy-legal { margin: 0; font: var(--fy-weight-regular) 10px/1.45 var(--fy-font); color: var(--fy-text-secondary); text-align: center; }
.fy-legal a, .fy-link { color: var(--fy-text-link); text-decoration: underline; text-underline-offset: 2px; font-weight: var(--fy-weight-medium); }
.fy-powered { display: flex; align-items: center; justify-content: center; gap: 4px; margin: 0; font: var(--fy-weight-regular) 10px/1.4 var(--fy-font); color: var(--fy-text-secondary); }
.fy-powered__brand { font-weight: var(--fy-weight-semibold); color: var(--fy-error); }

/* Account identifier chip, e.g. a bank logo and "XX1231". */
.fy-id-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: var(--fy-radius-pill); background: var(--fy-bg-surface); box-shadow: var(--fy-shadow-card); font: var(--fy-weight-regular) 12px/1.4 var(--fy-font); color: var(--fy-text-primary); }
.fy-step { font: var(--fy-weight-regular) 10px/1.4 var(--fy-font); color: var(--fy-text-secondary); }

@media (prefers-reduced-motion: reduce) {
  .fy-spinner { animation-duration: 2.4s; }
  .fy-group > summary .fy-chevron, .fy-faq summary .fy-chevron { transition: none; }
}

/* =====================================================================
 * Product components — Home, Assets, Transactions, Cashflow,
 * FIRE goals, FIRE age, Overrides and Launch pages in Figma.
 * ===================================================================== */

/* ---------- Bottom navigation ---------- */
.fy-bnb {
  display: grid; grid-template-columns: repeat(4, 1fr); height: 69px; padding: 0 var(--fy-space-4);
  background: var(--fy-white); border-radius: 6px 6px 0 0; box-shadow: 0 -2px 12px rgba(1, 35, 30, .06);
}
.fy-bnb a {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  border-top: 2px solid transparent; color: var(--fy-primary-100); text-decoration: none;
  font: var(--fy-weight-regular) 10px/1 var(--fy-font); letter-spacing: .01em;
}
.fy-bnb a svg { width: 20px; height: 20px; }
.fy-bnb a[aria-current="page"] { border-top-color: var(--fy-primary-400); color: var(--fy-primary-400); }

/* ---------- Member switcher (You / Spouse / Family) ---------- */
.fy-members { display: inline-flex; gap: 10px; }
.fy-members button {
  height: 24px; padding: 0 10px; border: 0; border-radius: var(--fy-radius-pill); background: transparent; cursor: pointer;
  font: var(--fy-weight-medium) 12px/1 var(--fy-font); letter-spacing: .01em; color: var(--fy-primary-200);
}
.fy-members button[aria-pressed="true"] {
  font-weight: var(--fy-weight-semibold); color: var(--fy-white);
  background: radial-gradient(120% 140% at 20% 0%, #185146 0%, var(--fy-primary-600) 70%);
  box-shadow: inset 0 0 10px rgba(255, 255, 255, .35);
}

/* ---------- Headline metric (Networth, Cashflow) ---------- */
.fy-metric { display: grid; justify-items: center; gap: 6px; text-align: center; }
.fy-metric__label { display: inline-flex; align-items: center; gap: 4px; font: var(--fy-weight-medium) 16px/22px var(--fy-font); color: var(--fy-primary-500); }
.fy-metric__label svg, .fy-info svg { width: 14px; height: 14px; color: var(--fy-primary-300); }
.fy-metric__value { display: inline-flex; align-items: center; gap: 8px; font: var(--fy-weight-bold) 32px/1.2 var(--fy-font); color: var(--fy-primary-600); font-variant-numeric: tabular-nums; }
.fy-metric__value svg { width: 20px; height: 20px; color: var(--fy-primary-500); }
.fy-updated {
  display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: var(--fy-radius-pill);
  background: rgba(255, 255, 255, .7); font: var(--fy-weight-regular) 10px/1.4 var(--fy-font); color: var(--fy-text-secondary);
}
.fy-updated svg { width: 10px; height: 10px; }
.fy-title-toggle { display: inline-flex; align-items: center; gap: 4px; padding: 0; border: 0; background: none; cursor: pointer; font: var(--fy-weight-medium) 14px/22px var(--fy-font); color: var(--fy-primary-500); }
.fy-title-toggle svg { width: 14px; height: 14px; }

/* ---------- Section card (Assets, Liabilities, Profile groups) ---------- */
.fy-section-card { display: grid; gap: var(--fy-space-3); padding: var(--fy-space-4); background: var(--fy-white); border-radius: 24px; box-shadow: var(--fy-shadow-card); }
.fy-section-card__head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--fy-space-3); }
.fy-section-card__title { margin: 0; font: var(--fy-weight-bold) 20px/1.4 var(--fy-font); color: var(--fy-primary-600); }
.fy-section-card__sub { margin: 0; font: var(--fy-weight-regular) 12px/1.5 var(--fy-font); color: var(--fy-primary-300); }
.fy-total-pill {
  flex: none; padding: 4px 10px; border-radius: var(--fy-radius-sm); background: var(--fy-success-50);
  font: var(--fy-weight-bold) 14px/22px var(--fy-font); color: var(--fy-primary-500); font-variant-numeric: tabular-nums;
}
.fy-add-link { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 6px; border: 0; background: none; cursor: pointer; font: var(--fy-weight-medium) 14px/1.5 var(--fy-font); color: var(--fy-primary-500); }
.fy-add-link::before { content: "+"; display: grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; background: var(--fy-primary-400); color: #fff; font-size: 13px; line-height: 1; }
.fy-retry { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border: 0; border-radius: var(--fy-radius-pill); background: var(--fy-success-50); cursor: pointer; font: var(--fy-weight-medium) 12px/1.4 var(--fy-font); color: var(--fy-primary-500); }
.fy-retry svg { width: 12px; height: 12px; }

/* Asset / liability row: tinted card that opens the detail page. */
.fy-asset-row {
  display: flex; align-items: center; gap: 10px; width: 100%; min-height: 56px; padding: 10px 8px 10px 12px;
  border: 1px solid var(--fy-neutral-200); border-radius: var(--fy-radius-md); cursor: pointer; text-align: left;
  background: linear-gradient(100deg, var(--fy-white) 45%, var(--row-tint, var(--fy-neutral-100)) 140%);
  box-shadow: var(--fy-shadow-card); color: inherit;
}
.fy-asset-row__icon { display: grid; place-items: center; width: 28px; height: 28px; flex: none; color: var(--fy-primary-400); }
.fy-asset-row__icon svg { width: 22px; height: 22px; }
.fy-asset-row__name { flex: 1; min-width: 0; display: grid; font: var(--fy-weight-semibold) 14px/22px var(--fy-font); color: var(--fy-primary-600); }
.fy-asset-row__name small { font: var(--fy-weight-regular) 10px/1.3 var(--fy-font); color: var(--fy-text-secondary); }
.fy-asset-row__value { display: grid; justify-items: end; font: var(--fy-weight-semibold) 14px/22px var(--fy-font); color: var(--fy-neutral-600); font-variant-numeric: tabular-nums; }
.fy-asset-row__value small { display: inline-flex; align-items: center; gap: 3px; font: var(--fy-weight-regular) 10px/1.3 var(--fy-font); color: var(--fy-text-secondary); }
.fy-asset-row__value small.is-stale { color: var(--fy-warning-700); }
.fy-asset-row > .fy-chevron { width: 16px; height: 16px; color: var(--fy-neutral-400); }

/* ---------- Asset detail ---------- */
.fy-amount-pill { display: inline-flex; padding: 8px 18px; border-radius: var(--fy-radius-pill); background: var(--fy-white); box-shadow: var(--fy-shadow-card); font: var(--fy-weight-bold) 20px/1.3 var(--fy-font); color: var(--fy-primary-600); font-variant-numeric: tabular-nums; }
.fy-kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--fy-space-2); text-align: center; }
.fy-kpi { display: grid; gap: 2px; }
.fy-kpi__label { display: inline-flex; align-items: center; justify-content: center; gap: 4px; font: var(--fy-weight-regular) 12px/1.4 var(--fy-font); color: var(--fy-text-secondary); }
.fy-kpi__value { font: var(--fy-weight-semibold) 16px/22px var(--fy-font); color: var(--fy-primary-600); font-variant-numeric: tabular-nums; }
.fy-kpis--sm .fy-kpi__label { font-size: 10px; }
.fy-kpis--sm .fy-kpi__value { font-size: 14px; line-height: 20px; color: var(--fy-neutral-600); }
.is-gain { color: var(--fy-gain) !important; }
.is-loss { color: var(--fy-loss) !important; }
.fy-sort { display: inline-grid; place-items: center; width: 14px; height: 14px; padding: 1px; border: 0; border-radius: var(--fy-radius-pill); background: var(--fy-neutral-100); color: var(--fy-neutral-500); cursor: pointer; }
.fy-sort svg { width: 12px; height: 12px; }
.fy-count { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: var(--fy-radius-pill); background: var(--fy-success-50); font: var(--fy-weight-semibold) 11px/1 var(--fy-font); color: var(--fy-primary-400); }

/* Holding card (stock, mutual fund, bank). */
.fy-holding { display: grid; gap: var(--fy-space-3); padding: 12px; border: 1px solid var(--fy-neutral-100); border-radius: var(--fy-radius-md); background: var(--fy-white); box-shadow: 0 2px 18px rgba(0, 0, 0, .07); }
.fy-holding__head { display: flex; align-items: center; gap: var(--fy-space-2); }
.fy-holding__logo { display: grid; place-items: center; width: 36px; height: 36px; flex: none; border-radius: var(--fy-radius-sm); background: var(--fy-neutral-100); font: var(--fy-weight-bold) 12px/1 var(--fy-font); color: var(--fy-primary-400); }
.fy-holding__name { flex: 1; min-width: 0; display: grid; font: var(--fy-weight-semibold) 14px/19px var(--fy-font); color: var(--fy-primary-600); }
.fy-holding__meta { font: var(--fy-weight-regular) 10px/20px var(--fy-font); color: var(--fy-neutral-500); font-variant-numeric: tabular-nums; }
.fy-holding__value { display: grid; justify-items: end; font: var(--fy-weight-bold) 20px/1.2 var(--fy-font); color: var(--fy-neutral-600); font-variant-numeric: tabular-nums; }
.fy-holding__value small { font-size: 10px; font-weight: var(--fy-weight-regular); color: var(--fy-text-secondary); }
.fy-holding hr { margin: 0; border: 0; border-top: 1px solid var(--fy-neutral-200); }

/* Bottom category tabs (Stocks / Cash / Gold / Real estate). */
.fy-cat-tabs { display: flex; gap: var(--fy-space-2); padding: var(--fy-space-3) var(--fy-space-4); overflow-x: auto; background: var(--fy-white); border-radius: var(--fy-radius-lg) var(--fy-radius-lg) 0 0; box-shadow: var(--fy-shadow-panel); scrollbar-width: none; }
.fy-cat-tabs button { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border: 0; border-radius: var(--fy-radius-sm); background: transparent; cursor: pointer; font: var(--fy-weight-medium) 14px/1 var(--fy-font); color: var(--fy-primary-300); }
.fy-cat-tabs button svg { width: 16px; height: 16px; }
.fy-cat-tabs button[aria-pressed="true"] { background: var(--fy-success-50); color: var(--fy-primary-600); font-weight: var(--fy-weight-semibold); }

/* ---------- Transactions ---------- */
.fy-filterbar { display: flex; gap: var(--fy-space-2); overflow-x: auto; scrollbar-width: none; }
.fy-dropdown-chip, .fy-icon-chip {
  flex: none; display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px;
  border: 1px solid var(--fy-neutral-200); border-radius: var(--fy-radius-sm); background: var(--fy-white); cursor: pointer;
  font: var(--fy-weight-medium) 12px/1 var(--fy-font); color: var(--fy-primary-500);
}
.fy-dropdown-chip svg, .fy-icon-chip svg { width: 14px; height: 14px; }
.fy-dropdown-chip[aria-pressed="true"] { border-color: var(--fy-success-600); background: var(--fy-success-50); }
.fy-group-head { display: flex; justify-content: space-between; align-items: baseline; padding: var(--fy-space-4) 0 var(--fy-space-2); font: var(--fy-weight-medium) 14px/22px var(--fy-font); color: var(--fy-text-secondary); font-variant-numeric: tabular-nums; }
.fy-group-head b { font-weight: var(--fy-weight-semibold); color: var(--fy-neutral-600); }
.fy-txn { display: flex; align-items: center; gap: var(--fy-space-3); padding: 14px 12px; border-radius: var(--fy-radius-md); background: var(--fy-white); box-shadow: var(--fy-shadow-card); }
.fy-avatar { position: relative; display: grid; place-items: center; width: 40px; height: 40px; flex: none; border-radius: 50%; background: var(--fy-neutral-200); font: var(--fy-weight-semibold) 13px/1 var(--fy-font); color: var(--fy-primary-500); }
.fy-avatar__badge { position: absolute; right: -2px; bottom: -2px; display: grid; place-items: center; width: 16px; height: 16px; border: 2px solid var(--fy-white); border-radius: 50%; background: var(--fy-error-600); color: #fff; font-size: 7px; font-weight: 700; }
.fy-txn__body { flex: 1; min-width: 0; display: grid; gap: 6px; }
.fy-txn__name { font: var(--fy-weight-medium) 16px/22px var(--fy-font); color: var(--fy-primary-600); }
.fy-txn__tags { display: flex; align-items: center; gap: 6px; }
.fy-tag-chip { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border: 1px solid var(--fy-neutral-200); border-radius: 4px; background: var(--fy-white); cursor: pointer; font: var(--fy-weight-medium) 9px/1 var(--fy-font); letter-spacing: .06em; text-transform: uppercase; color: var(--fy-neutral-500); }
.fy-tag-chip--add { color: var(--fy-primary-400); }
.fy-txn__amount { display: grid; justify-items: end; gap: 6px; font: var(--fy-weight-semibold) 16px/22px var(--fy-font); color: var(--fy-neutral-600); font-variant-numeric: tabular-nums; }
.fy-txn__amount small { font: var(--fy-weight-regular) 10px/1 var(--fy-font); color: var(--fy-text-secondary); }

/* Filters: vertical tab rail + option list. */
.fy-filters { display: grid; grid-template-columns: 88px 1fr; flex: 1; min-height: 0; border-top: 1px solid var(--fy-neutral-200); }
.fy-filters__rail { display: grid; align-content: start; border-right: 1px solid var(--fy-neutral-200); }
.fy-filters__rail button {
  position: relative; display: grid; justify-items: center; gap: 6px; padding: 14px 4px; border: 0; border-right: 2px solid transparent;
  background: none; cursor: pointer; font: var(--fy-weight-regular) 11px/1.2 var(--fy-font); color: var(--fy-primary-300);
}
.fy-filters__rail button svg { width: 16px; height: 16px; }
.fy-filters__rail button[aria-selected="true"] { background: var(--fy-success-50); border-right-color: var(--fy-success-600); color: var(--fy-primary-500); }
.fy-filters__rail .fy-badge { position: absolute; top: 6px; right: 22px; }
.fy-badge { display: grid; place-items: center; min-width: 16px; height: 16px; padding: 0 4px; border-radius: var(--fy-radius-pill); background: var(--fy-success-600); color: #fff; font: var(--fy-weight-semibold) 10px/1 var(--fy-font); }
.fy-filters__panel { display: grid; align-content: start; gap: 10px; padding: var(--fy-space-4) var(--fy-space-3); }

/* Radio / checkbox rows. */

/* Verbatim clause text from ReBIT “Standards to enhance customer protection and user experience
 * within the Account Aggregator framework”, v1.0.0, 30 Apr 2026 (ReBIT/AA/TechStds/02). [section, page, text] */
const REBIT = {
  '2.1': ['2.1 Account Discovery and Linking', 4, 'In case the user changes or updates the mobile number, AA shall ensure that there are no linked accounts and associated consents attached to the said mobile number. In case the user desires to delink his/ her account, user authentication shall be performed by the AA before initiating the account delink request. The authentication for delinking may use the same verified identifier used during account linking. AA shall ensure that all active consents linked to the account have been revoked by the user prior to delinking the account.'],
  '2.1.i': ['2.1 Account Discovery and Linking', 4, 'AA can allow a customer to link up to two mobile numbers in its AA Client as identifier for account discovery. The account discovery shall be performed using at least one mobile number linked with the AA Client.'],
  '2.1.ii': ['2.1 Account Discovery and Linking', 4, 'Further, to improve the account discovery process, the AA shall give optional fields to the customer for using PAN or Date of Birth as additional identifiers during the account discovery or linking process along with the mobile number.'],
  '2.2': ['2.2 AA Client Account Management', 4, 'The AA entities shall ensure that the customer’s account profile captures the minimum necessary details required for the effective functioning of AA account. The sensitive information shall be masked to protect the customer’s privacy. The captured information may include (O): a. Customer First Name, Middle Name, Last Name; b. Verified Mobile Number(s); c. Email Address (if provided).'],
  '2.2.i': ['2.2 AA Client Account Management', 4, 'Account identification: There is a need to uniquely identify AA account opened for each user. Therefore, the AA shall provide a Virtual User Address (VUA) to the user as a unique identifier. The mobile numbers based on which the accounts are discovered, and consents are provided will be mapped to the VUA for any further communication. Users shall be allowed to create their own VUA for convenience. Multiple mobile numbers of the customer shall be managed under a single VUA.'],
  '2.2.ii': ['2.2 AA Client Account Management', 4, 'AA Client shall check if the user’s AA account exists and highlights the same before onboarding the user so that the user is aware of its previously created accounts.'],
  '2.2.iii': ['2.2 AA Client Account Management', 4, 'Account closure: In order to improve the user control on their AA account, AA shall allow its customers to close his/ her account at any point in time. During the closure of the account, AA shall ensure that all active consents linked to the account are revoked and all linked accounts are delinked.'],
  '2.2.iv': ['2.2 AA Client Account Management', '4–5', 'Account recovery: AA shall allow customers to recover their account credentials if they lose access to the account. Account recovery process shall include verification of mobile number provided by the user during registration. User shall be allowed to initiate account recovery requests both digitally (using AA Client) or manually (by contacting AA Customer Support Team)'],
  '3.1 (complaints)': ['3.1 Consent field table: complaints', 7, 'Complain to FI-U: Information on how to register a complaint with the FI-U. Complain to AA: Information on how to register a complaint with the AA. Complain to Data Protection Board: Information on how to register a complaint with the Data Protection Board. (Keep a provision to be enabled when the Data Protection Board is set up and reporting channel is clearly laid out)'],
  '3.1.ii': ['3.1 Clear Presentation of consent fields to the customer', 5, 'All consent parameters specified in consent artefact structure recommended in the API Specifications shall be in a font which is legible and clearly visible to user before he/ she acts on the consent request. In case all the consent fields cannot be fully displayed on the mobile device screen, AA Client shall at least display the following fields in the screen where the user gives consent: a. Consent Start b. Consent Expiry c. Fetch Type (One-time/ Periodic) d. FI Types (Deposit, Mutual Fund etc.) e. Data Consumer (FI-U name) f. Purpose (purpose for which data is fetched) g. FI data range (period for which data is fetched) h. Frequency of data pulls. The remaining fields shall be shown with a ‘view more’ section in the same screen.'],
  '3.1.iii': ['3.1 Clear Presentation of consent fields to the customer', 5, 'The information about each consent artefact parameter shall be available to the customer on consent approval screen if customer wishes to know more about the same. Additionally, AA Client shall inform the customer briefly (as a superscript) regarding the type of information shared under the \'Profile\', \'Summary\' and \'Transactions\' section of the financial information.'],
  '3.1.iv': ['3.1 Clear Presentation of consent fields to the customer', 5, 'FI-U and AA shall ensure that the purpose for all the consents is clearly informed to the customer. Further, the FI-U and AA shall ensure that each consent is displayed as separate consent component to the customer and are not merged in a single consent. A single purpose code shall be displayed to user with each consent.'],
  '3.1.vi': ['3.1 Clear Presentation of consent fields to the customer', 5, 'The consent parameters shall be given meaningful descriptions which specifies purpose of the field and is easily understood by the user. Details of the consent fields and its purpose is given below for reference.'],
  '3.2.i': ['3.2 Enhancing user control on consent operations', 7, 'The consent management screen shall contain the word “Consent”.'],
  '3.2.ii': ['3.2 Enhancing user control on consent operations', 7, 'The users shall be provided with necessary control over their consents, including the ability to Approve, Reject, Revoke, Pause and Resume consents.'],
  '3.2.iii': ['3.2 Enhancing user control on consent operations', 7, 'The consent approve action shall be a separate interaction with user and shall not be clubbed with any other interaction.'],
  '3.2.iv': ['3.2 Enhancing user control on consent operations', 7, 'The consent approval screen shall clearly specify the button names as "Approve" or "Reject". The Approve and Reject button shall be of same size and visibility.'],
  '3.2.v': ['3.2 Enhancing user control on consent operations', 7, 'The Approve button shall not be the default option for the user. Consent approval/ rejection shall be taken from user on the “Click” action of respective buttons.'],
  '3.2.vi': ['3.2 Enhancing user control on consent operations', 7, 'In case of multiple consents, AA shall provide the “Approve” and “Reject” button for each consent separately.'],
  '3.2.vii': ['3.2 Enhancing user control on consent operations', 7, 'AA shall implement consent expiry mechanisms to ensure that consents have a defined validity period.'],
  '3.2.viii': ['3.2 Enhancing user control on consent operations', 7, 'If the consent request is raised by FI-U for specific FI Types, only the related accounts shall be displayed to the customer for attaching with the consent during consent approval.'],
  '3.2.ix': ['3.2 Enhancing user control on consent operations', 7, 'In case of users having multiple FI-P accounts, the AA Client shall provide the users the ability to explicitly select the FI-P accounts they wish to link or attach to their consent prior to approving it. This functionality shall include an opt-in mechanism, such as checkboxes, which must not be preselected, ensuring voluntary and informed consent.'],

        <hr class="divider"><p class="small muted" style="margin:0">Not resolved in 30 days? Escalate to the <b>RBI Ombudsman</b> at cms.rbi.org.in.</p>
      </div>
      <div class="card stack"><p class="eyebrow">Complaint about the requester</p><p class="small" style="margin:0;color:var(--fy-primary-500)">Finny · support@finny.app</p></div>
      <div class="card stack" style="opacity:.6"><p class="eyebrow">Data Protection Board</p><p class="small muted" style="margin:0">Available once the Board’s reporting channel opens.</p></div>
    </div>
    <div class="foot foot--plain">${tagline}</div>`) });

add({ id: 'complaint', flow: '§4 User experience: profile, notifications & help', title: 'Raise a complaint', isNew: true, clauses: ['4.2.viii'],
  notes: ['Pre-filled consent reference, category chips and a tracking ID on submit.'],
  render: () => screen(`${aabar()}
    <div class="scroll pad stack-4">

      <label class="fy-field"><span class="fy-field__label">Consent</span><span class="fy-input"><select id="cmp-c"><option>Finny · Financial planning (FV-26-0091)</option></select></span></label>
      <label class="fy-field"><span class="fy-field__label">Describe the issue</span><span class="fy-input" style="height:auto"><textarea id="cmp-t" rows="4" style="flex:1;border:0;padding:10px 12px;font:400 14px/1.5 var(--fy-font);resize:none;outline:none" placeholder="E.g. data was fetched after I paused the consent"></textarea></span></label>

  notes: ['Closing revokes every active consent and delinks every account. The screen lists exactly what will happen before the user confirms.'],
  render: () => screen(`${aabar()}
    <div class="scroll pad stack-4">

      <label class="row small" style="gap:10px;color:var(--fy-primary-500)"><input class="fy-checkbox" type="checkbox" data-gate-check aria-label="I understand">I understand this can’t be undone</label>

add({ id: 'fip-list', flow: '§4 User experience: profile, notifications & help', title: 'Institutions on Finvu', isNew: true, clauses: ['4.1.vii'],
  notes: ['Searchable list of all FIPs available through the AA, for transparency.'],
  render: () => screen(`${aabar()}
    <div class="scroll pad stack-4" style="padding-bottom:16px">
      <h1 class="title title--sm" style="font-size:20px">112 institutions</h1>
      <div class="fy-input" style="height:44px"><input id="fip-q" placeholder="Search bank or institution"></div>
      <div class="fy-filter" data-group><button class="fy-filter__chip" aria-pressed="true">All</button><button class="fy-filter__chip" aria-pressed="false">Banks</button><button class="fy-filter__chip" aria-pressed="false">MF</button><button class="fy-filter__chip" aria-pressed="false">Equities</button><button class="fy-filter__chip" aria-pressed="false">Insurance</button></div>
      <div class="card card--flush">${[...BANKS.slice(0, 2), { bank: 'HDFC Bank', type: 'Bank', num: '', mark: 'H', color: '#004C8F' }, { bank: 'ICICI Bank', type: 'Bank', num: '', mark: 'I', color: '#B02A30' }, ...MF, ...EQ].map(a => `<div class="acct">${logo(a)}<span class="acct__text"><span class="acct__name">${a.bank}</span><span class="acct__meta">${a.fi || a.type}</span></span><span class="pill pill--ok">Live</span></div>`).join('')}</div>
    </div>
    <div class="foot foot--plain">${tagline}</div>`) });

/* ============================================================
 * Router + interactions
 * ============================================================ */
const byId = Object.fromEntries(S.map((s, i) => [s.id, { ...s, n: i }]));
let cur = 'redirect';
const hist = [];
const $ = (q, r = document) => r.querySelector(q);

function renderIndex() {
  let html = '', flow = '';
  S.forEach((s, i) => {
    if (s.flow !== flow) { flow = s.flow; html += `<h2>${flow}</h2>`; }
    html += `<button type="button" data-jump="${s.id}" aria-current="${s.id === cur}"><b>${String(i + 1).padStart(2, '0')}</b>${s.title}<span class="tags">${s.opt ? `<span class="tag-opt" title="${s.opt[0]}">${s.opt[0]}</span>` : ''}${s.isNew ? '<span class="tag-new">New</span>' : ''}</span></button>`;
  });
  $('#index').innerHTML = html;
}
function renderWhy() {
  const s = byId[cur];
  $('#why').innerHTML = `<span class="label">${s.isNew ? 'New screen' : 'Improved from your design'}</span>
    <h3>${s.title}</h3>
    <ul>${s.notes.map(n => `<li>${n}</li>`).join('')}</ul>
    ${s.opt ? `<p class="opt-note"><b>${s.opt[0]}.</b> ${s.opt[1]}</p>` : ''}
    <span class="label">ReBIT AA standard <small>· tap a clause to read it</small></span>
    <div class="clauses">${s.clauses.map(c => `<button type="button" data-clause="${c}" aria-expanded="false">§${c}</button>`).join('')}</div>
    <div class="clause-panel" id="clause-panel" hidden></div>`;
  wireClauses();
  $('#crumb').innerHTML = `${s.flow} · <b>${s.title}</b> · ${s.n + 1} of ${S.length}`;
}
// Tap a clause chip to show its verbatim text right below the chips; tap again to close.
function wireClauses() {
  const panel = $('#clause-panel');
  $('#why').querySelectorAll('[data-clause]').forEach(b => b.addEventListener('click', () => {
    const open = b.getAttribute('aria-expanded') === 'true';
    $('#why').querySelectorAll('[data-clause]').forEach(x => x.setAttribute('aria-expanded', 'false'));
    if (open) { panel.hidden = true; return; }
    const c = REBIT[b.dataset.clause];
    b.setAttribute('aria-expanded', 'true');
    panel.innerHTML = c
      ? `<div class="clause-panel__head"><b>§${b.dataset.clause}</b><span>${c[0]}</span><button type="button" class="clause-panel__x" aria-label="Close">×</button></div><blockquote>${c[2]}</blockquote><small>ReBIT AA Standard v1.0.0 (30 Apr 2026) · page ${c[1]}</small>`
      : `<div class="clause-panel__head"><b>§${b.dataset.clause}</b><button type="button" class="clause-panel__x" aria-label="Close">×</button></div><blockquote>Text not available.</blockquote>`;
    panel.hidden = false;
    panel.querySelector('.clause-panel__x').addEventListener('click', () => { panel.hidden = true; b.setAttribute('aria-expanded', 'false'); b.focus(); });
  }));
}
function go(id, push = true) {
  if (!byId[id]) return;
  if (push && id !== cur) hist.push(cur);
  cur = id;
  $('#phone').innerHTML = byId[id].render();
  wire($('#phone'));
  renderIndex(); renderWhy();
  try { history.replaceState(null, '', '#' + id); } catch (e) {}
}

function wire(root) {
  root.querySelectorAll('[data-go]').forEach(el => el.addEventListener('click', e => { if (el.disabled) return; e.preventDefault(); go(el.dataset.go); }));
  root.querySelectorAll('[data-back]').forEach(el => el.addEventListener('click', e => { e.preventDefault(); go(hist.pop() || 'redirect', false); }));
  root.querySelectorAll('[data-field]').forEach(el => el.addEventListener('click', e => { e.preventDefault(); showField(root, el.dataset.field); }));
  root.querySelectorAll('[data-group]').forEach(g => g.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.dataset.go) return;
    g.querySelectorAll(':scope > button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  }));
  // Account picker: nothing preselected; button counts selections.
  const countBtn = root.querySelector('[data-count]');
  const recount = () => { if (!countBtn) return; const n = root.querySelectorAll('[data-pick]:checked').length; countBtn.disabled = !n; countBtn.textContent = n ? `Continue with ${n} account${n > 1 ? 's' : ''}` : 'Select accounts to continue'; };
  root.querySelectorAll('[data-pick]').forEach(c => c.addEventListener('change', recount));
  root.querySelectorAll('[data-selectall]').forEach(b => b.addEventListener('click', e => {
    e.preventDefault(); const box = b.closest('[data-groupbox]'); const cs = [...box.querySelectorAll('[data-pick]')]; const all = cs.every(c => c.checked);
    cs.forEach(c => c.checked = !all); b.textContent = all ? 'Select all' : 'Clear'; recount();
  }));
  // Separate decision per consent.
  const gate = root.querySelector('[data-allgate]');
  root.querySelectorAll('[data-decision-card]').forEach(card => card.querySelectorAll('[data-decide]').forEach(b => b.addEventListener('click', () => {
    const ok = b.dataset.decide === 'ok';
    card.querySelector('.decide').outerHTML = `<div class="decision decision--${ok ? 'ok' : 'no'}">${ok ? '✓ Approved' : '✕ Rejected'} <button class="link small" data-undo style="margin-left:6px">Change</button></div>`;
    card.querySelector('[data-undo]').addEventListener('click', () => go('multi', false));
    const left = root.querySelectorAll('[data-decision-card] .decide').length;
    if (gate) { gate.disabled = !!left; gate.textContent = left ? 'Decide on both to continue' : 'Confirm decisions'; }
  })));
  const gc = root.querySelector('[data-gate-check]'), gb = root.querySelector('[data-gate-btn]');
  if (gc && gb) gc.addEventListener('change', () => gb.disabled = !gc.checked);
  root.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', () => {
    navigator.clipboard?.writeText(b.dataset.copy).then(() => b.textContent = 'Copied', () => b.textContent = 'Copy failed');
  }));
  root.querySelectorAll('[data-speak]').forEach(b => b.addEventListener('click', () => {
    const t = 'Finny requests consent. Purpose: personal financial planning. Start 8 October 2026, expiry 8 October 2027. Periodic fetch, once a month, last 12 months of deposits, mutual funds and equities.';
    try { speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance(t)); b.innerHTML = ic('mic') + 'Playing…'; } catch (e) { b.textContent = 'Audio unavailable'; }
  }));
  root.querySelectorAll('[data-otp]').forEach(row => { const c = [...row.querySelectorAll('input')];
    c.forEach((el, i) => { el.addEventListener('input', () => { el.value = el.value.replace(/\D/g, '').slice(-1); if (el.value) c[i + 1]?.focus(); });
      el.addEventListener('keydown', e => { if (e.key === 'Backspace' && !el.value) c[i - 1]?.focus(); }); }); });
}

function showField(root, k) {
  const [label, meaning, ex] = FIELDS[k];
  const extra = k === 'ctype' ? Object.entries(CTYPE).map(([a, b]) => `<span><b>${a}:</b> ${b}</span>`).join('') : `<span><b>In this request:</b> ${ex}</span>`;
  const host = document.createElement('div');
  host.className = 'sheet-host';
  host.innerHTML = `<div class="fy-sheet" role="dialog" aria-label="${label}"><div class="handle"></div>
    <div class="fy-sheet__head fy-sheet__head--plain" style="padding-bottom:4px"><button class="fy-icon-btn fy-sheet__close" aria-label="Close">${ic('close')}</button><p class="fy-sheet__title" style="font-size:20px">${label}</p></div>
    <div class="sheet-body"><div class="meaning"><span>${meaning}</span>${extra}</div><button class="fy-btn fy-btn--secondary">Got it</button></div></div>`;
  const close = () => host.remove();
  host.addEventListener('click', e => { if (e.target === host) close(); });
  host.querySelectorAll('button').forEach(b => b.addEventListener('click', close));
  root.firstElementChild.appendChild(host);
  host.querySelector('button').focus();
}

/* Gallery: every screen, static, grouped by flow. */
function renderGallery() {
  const flows = [...new Set(S.map(s => s.flow))];
  $('#gallery').innerHTML = `<div><h2>All ${S.length} screens</h2><p class="lede">Static view of every screen, grouped by flow. Switch to Prototype to click through.</p></div>` +
    flows.map(f => `<section><h2 style="font-size:17px">${f}</h2><div class="gallery__row">${S.filter(s => s.flow === f).map(s => `<div class="gallery__item"><div class="phone">${s.render()}</div><div class="gallery__cap"><b>${String(byId[s.id].n + 1).padStart(2, '0')}</b>${s.title}${s.isNew ? ' · <span style="color:var(--fy-warning-700)">New</span>' : ''}</div></div>`).join('')}</div></section>`).join('');
}

document.addEventListener('click', e => { const j = e.target.closest('[data-jump]'); if (j) { hist.length = 0; go(j.dataset.jump); } });
$('#prev').addEventListener('click', () => { const i = byId[cur].n; if (i > 0) go(S[i - 1].id); });
$('#next').addEventListener('click', () => { const i = byId[cur].n; if (i < S.length - 1) go(S[i + 1].id); });
const setMode = (all) => {
  $('#mode-proto').setAttribute('aria-pressed', String(!all)); $('#mode-all').setAttribute('aria-pressed', String(all));
  $('#proto').hidden = all; $('#gallery').hidden = !all;
  if (all && !$('#gallery').innerHTML) renderGallery();
};
$('#mode-proto').addEventListener('click', () => setMode(false));
$('#mode-all').addEventListener('click', () => setMode(true));

const start = (location.hash || '').slice(1);
go(byId[start] ? start : 'redirect', false);
</script>
</body>
