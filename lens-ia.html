<title>Lens Information Architecture</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a classic top-down site map. Each level is one row of boxes,
   joined by connector lines; the lowest level lists as stacked boxes. */
:root {
  --bg: #f6f6f9;
  --surface: #ffffff;
  --ink: #23263b;
  --ink-2: #6b697b;
  --line: #c9c7d6;
  --root: #0975d7;
  --root-ink: #ffffff;
  --branch: #e6f1fc;
  --branch-ink: #0b5aa6;
  --font: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15161f; --surface: #1f2030; --ink: #ecebf4; --ink-2: #a9a7ba; --line: #45455c;
    --root: #3d8fe0; --root-ink: #ffffff; --branch: #1b2b40; --branch-ink: #8cc2f5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15161f; --surface: #1f2030; --ink: #ecebf4; --ink-2: #a9a7ba; --line: #45455c;
  --root: #3d8fe0; --root-ink: #ffffff; --branch: #1b2b40; --branch-ink: #8cc2f5;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; }
.wrap { padding-block: 40px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 28px; }
h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.01em; text-align: center; }
.scroll { overflow-x: auto; padding-bottom: 8px; }
.map { min-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; }

.box { display: inline-flex; align-items: center; justify-content: center; text-align: center; border-radius: 8px; padding: 10px 16px; font-weight: 600; line-height: 1.3; }
.box.root { background: var(--root); color: var(--root-ink); font-size: 16px; padding: 12px 24px; }
.box.branch { background: var(--branch); color: var(--branch-ink); width: 100%; font-size: 14px; }
.box.leaf { background: var(--surface); border: 1px solid var(--line); font-weight: 500; font-size: 13px; width: 100%; padding: 8px 10px; }
.box.leaf.sub { width: calc(100% - 14px); margin-left: 14px; font-size: 12.5px; color: var(--ink-2); }

.vline { width: 1px; height: 24px; background: var(--line); }
.branches { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 0 14px; width: 100%; position: relative; }
.col { display: flex; flex-direction: column; align-items: center; position: relative; padding-top: 24px; }
/* Horizontal rail across the tops of the columns, from first to last centre. */
.col::before { content: ""; position: absolute; top: 0; left: -7px; right: -7px; border-top: 1px solid var(--line); }
.col:first-child::before { left: 50%; }
.col:last-child::before { right: 50%; }
.col::after { content: ""; position: absolute; top: 0; left: 50%; height: 24px; border-left: 1px solid var(--line); }
.leaves { width: 100%; display: flex; flex-direction: column; gap: 8px; margin-top: 14px; padding-left: 12px; border-left: 1px solid var(--line); margin-left: 12px; }
.leaves { width: calc(100% - 12px); }
.leaves > .box.leaf { position: relative; }
.leaves > .box.leaf::before { content: ""; position: absolute; left: -13px; top: 50%; width: 12px; border-top: 1px solid var(--line); }
.box.leaf.sub::before { left: -27px !important; width: 26px !important; }
.note { text-align: center; color: var(--ink-2); font-size: 12.5px; }
</style>

<div class="wrap">
  <h1>Lens site map</h1>
  <div class="scroll">
    <div class="map" id="map"></div>
  </div>
  <p class="note">Modals and menus are shown indented under the item that opens them.</p>
</div>

<script>
// Each branch is a top-level area of the Process Map; "↳" marks something
// opened from the item above it (a menu, tab content or modal).
const SITEMAP = {
  entry: 'Overview',
  root: 'Process Map',
  branches: [
    { t: 'Header', c: ['Back to Overview', 'Export', '↳ PNG', '↳ PDF', 'Import', '↳ Upload .json / .bpmn', '↳ Sample format', 'KPI band'] },
    { t: 'Process map', c: ['BPMN view', '↳ Subprocess drill-down', 'Path view', 'Process Variants control', 'Play animation', 'Legend', 'Task & edge hover cards'] },
    { t: 'Insights', c: ['Summary tab', 'Paths tab', '↳ All processes table', '↳ Fast vs Typical', 'Expanded dashboard', '↳ Process overview', '↳ Path overview', '↳ Task overview'] },
    { t: 'Task detail', c: ['Overview tab', 'Automation tab', '↳ Automation preview', '↳ Send to Seek', 'Watch session', '↳ Session replay'] },
    { t: 'Automation', c: ['Opportunity list', 'View all opportunities'] },
    { t: 'Filter', c: ['Single instance per variant', 'By Task', 'By Path', 'By Duration', 'By Process / Case ID', 'By User ID'] },
    { t: 'AI Summary', c: ['Process summary'] },
  ],
};

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
document.getElementById('map').innerHTML = `
  <span class="box root">${esc(SITEMAP.entry)}</span>
  <span class="vline"></span>
  <span class="box root">${esc(SITEMAP.root)}</span>
  <div class="branches">
    ${SITEMAP.branches.map((b) => `
      <div class="col">
        <span class="box branch">${esc(b.t)}</span>
        <div class="leaves">
          ${b.c.map((l) => l.startsWith('↳ ')
            ? `<span class="box leaf sub">${esc(l.slice(2))}</span>`
            : `<span class="box leaf">${esc(l)}</span>`).join('')}
        </div>
      </div>`).join('')}
  </div>`;
</script>
