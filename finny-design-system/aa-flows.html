<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Finny AA Flows</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="tokens.css" />
<style>
  /* Layout: three panes — flow index, live phone, rationale. Collapses to one column on phones. */
  :root { color-scheme: light; --pane: #FFFFFF; --stage: var(--fy-neutral-200); }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: var(--fy-font); background: var(--stage); color: var(--fy-text-primary); -webkit-font-smoothing: antialiased; }
  button { font-family: inherit; }

  .topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 12px 20px; background: var(--fy-bg-inverse); color: #fff; }
  .topbar__brand { font: 700 20px/1 var(--fy-font); letter-spacing: -.3px; }
  .topbar__brand span { font-weight: 400; font-size: 13px; color: var(--fy-neutral-300); margin-left: 8px; letter-spacing: 0; }
  .modes { display: inline-flex; margin-left: auto; padding: 3px; border-radius: 999px; background: #0b3a33; }
  .modes button { height: 30px; padding: 0 14px; border: 0; border-radius: 999px; background: none; color: var(--fy-neutral-300); font-size: 12px; font-weight: 500; cursor: pointer; }
  .modes button[aria-pressed="true"] { background: #fff; color: var(--fy-primary-600); font-weight: 600; }

  .proto { display: grid; grid-template-columns: 280px minmax(0, 1fr) 320px; gap: 20px; max-width: 1360px; margin: 0 auto; padding: 20px; align-items: start; }
  .pane { background: var(--pane); border-radius: 16px; box-shadow: var(--fy-shadow-card); }
  .index { position: sticky; top: 76px; max-height: calc(100vh - 96px); overflow: auto; padding: 14px 10px; }
  .index h2 { margin: 14px 10px 6px; font: 600 11px/1.3 var(--fy-font); letter-spacing: .08em; text-transform: uppercase; color: var(--fy-primary-300); }
  .index h2:first-child { margin-top: 2px; }
  .index button { display: flex; gap: 8px; align-items: baseline; width: 100%; padding: 7px 10px; border: 0; border-radius: 8px; background: none; text-align: left; cursor: pointer; font: 400 13px/1.35 var(--fy-font); color: var(--fy-primary-500); }
  .index button b { min-width: 26px; font-weight: 600; font-size: 11px; color: var(--fy-primary-300); font-variant-numeric: tabular-nums; }
  .index button:hover { background: var(--fy-neutral-100); }
  .index button[aria-current="true"] { background: var(--fy-success-50); color: var(--fy-primary-600); font-weight: 600; }
  .index .tag-new { margin-left: auto; padding: 1px 6px; border-radius: 4px; background: var(--fy-warning-50); color: var(--fy-warning-700); font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }

  .stage { display: grid; justify-items: center; gap: 14px; }
  .stage__crumb { font: 500 12px/1.4 var(--fy-font); color: var(--fy-primary-300); text-align: center; }
  .stage__crumb b { color: var(--fy-primary-600); font-weight: 600; }
  .stage__nav { display: flex; gap: 10px; }
  .stage__nav button { height: 34px; padding: 0 14px; border: 1px solid var(--fy-neutral-300); border-radius: 999px; background: #fff; cursor: pointer; font-size: 12px; font-weight: 500; color: var(--fy-primary-500); }

  .phone { position: relative; width: 360px; max-width: 100%; height: 760px; border-radius: 32px; overflow: hidden; background: var(--fy-bg-canvas); box-shadow: 0 0 0 10px #0d1a17, 0 24px 60px rgba(1,35,30,.35); }
  .phone > .fy-screen { height: 100%; }

  .why { position: sticky; top: 76px; padding: 18px 18px 20px; display: grid; gap: 14px; }
  .why h3 { margin: 0; font: 600 16px/1.35 var(--fy-font); color: var(--fy-primary-600); }
  .why p { margin: 0; font-size: 13px; line-height: 1.55; color: var(--fy-text-secondary); }
  .why ul { margin: 0; padding-left: 18px; display: grid; gap: 8px; font-size: 13px; line-height: 1.5; color: var(--fy-primary-500); }
  .why .clauses { display: flex; flex-wrap: wrap; gap: 6px; }
  .why .clauses span { padding: 3px 8px; border-radius: 6px; background: var(--fy-neutral-100); font: 600 11px/1.4 var(--fy-font); color: var(--fy-primary-400); }
  .why .label { font: 600 11px/1 var(--fy-font); letter-spacing: .08em; text-transform: uppercase; color: var(--fy-primary-300); }

  .gallery { max-width: 1400px; margin: 0 auto; padding: 24px 20px 60px; display: grid; gap: 36px; }
  .gallery h2 { margin: 0 0 4px; font: 700 22px/1.3 var(--fy-font); color: var(--fy-primary-600); }
  .gallery .lede { margin: 0 0 16px; font-size: 13px; color: var(--fy-text-secondary); }
  .gallery__row { display: flex; flex-wrap: wrap; gap: 28px; }
  .gallery__item { display: grid; gap: 10px; width: 300px; }
  .gallery__item .phone { width: 300px; height: 634px; border-radius: 26px; box-shadow: 0 0 0 6px #0d1a17, 0 12px 30px rgba(1,35,30,.25); }
  .gallery__item .phone > .fy-screen { zoom: .8333; height: 760px; }
  .gallery__cap { font: 500 12px/1.4 var(--fy-font); color: var(--fy-primary-500); }
  .gallery__cap b { color: var(--fy-primary-300); font-weight: 600; margin-right: 6px; }
  [hidden] { display: none !important; }

  /* ---------- App-level additions built on Finny tokens ---------- */
  .scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; }
  .pad { padding: 0 var(--fy-space-4); }
  .stack { display: grid; gap: var(--fy-space-3); grid-template-columns: minmax(0, 1fr); align-content: start; }
  .stack-4 { display: grid; gap: var(--fy-space-4); grid-template-columns: minmax(0, 1fr); align-content: start; }
  .scroll.stack-4 { padding-top: 8px; padding-bottom: 16px; }
  .center > * { justify-self: center; }
  .center > .steps, .center > .card, .center > .stat3, .center > .progress { justify-self: stretch; }
  .fy-screen .fy-art:not(.fy-art--error):not(.fy-art--success) { background: var(--fy-white); box-shadow: var(--fy-shadow-card); }
  .fy-art { width: 72px; height: 72px; }
  .logo svg { width: 18px; height: 18px; color: var(--fy-primary-400); }
  .consent-card, .card { min-width: 0; }
  .consent-card { grid-template-columns: minmax(0, 1fr); }
  .stack, .stack-4 { grid-auto-rows: max-content; }
  .fy-btn svg { width: 16px; height: 16px; flex: none; }
  .center { text-align: center; }
  .sb { display: flex; justify-content: space-between; padding: 12px 20px 4px; font: 600 12px/1 var(--fy-font); color: var(--fy-text-primary); }
  .sb i { font-style: normal; letter-spacing: 2px; }
  .aabar { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; padding: 2px 8px; min-height: 48px; }
  .aabar__mid { justify-self: center; }
  .aa-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; border-radius: 999px; background: var(--fy-white); box-shadow: var(--fy-shadow-card); font: 600 12px/1 var(--fy-font); color: var(--fy-primary-600); }
  .aa-chip__mark { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--fy-primary-600); color: #fff; font-size: 11px; font-weight: 700; }
  .aa-chip small { font-weight: 400; color: var(--fy-text-secondary); font-size: 10px; }
  .tagline { margin: 0; padding: 8px 16px 10px; text-align: center; font: 400 10px/1.4 var(--fy-font); color: var(--fy-text-secondary); }
  .tagline b { font-weight: 600; color: var(--fy-primary-500); }
  .foot { padding: var(--fy-space-3) var(--fy-space-4) 0; background: var(--fy-bg-surface); box-shadow: var(--fy-shadow-panel); border-radius: 16px 16px 0 0; display: grid; gap: var(--fy-space-2); }
  .foot--plain { background: transparent; box-shadow: none; }
  .title { margin: 0; font: 700 26px/1.25 var(--fy-font); color: var(--fy-text-display); text-wrap: balance; }
  .title--sm { font-size: 22px; }
  .lede { margin: 0; font: 400 13px/1.55 var(--fy-font); color: var(--fy-text-secondary); }
  .lede b { color: var(--fy-primary-500); font-weight: 600; }
  .eyebrow { margin: 0; font: 600 11px/1.3 var(--fy-font); letter-spacing: .06em; text-transform: uppercase; color: var(--fy-primary-300); }
  .card { background: var(--fy-white); border-radius: var(--fy-radius-md); box-shadow: var(--fy-shadow-card); padding: var(--fy-space-4); }
  .card--flush { padding: 0; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 10px; }
  .row--between { justify-content: space-between; }
  .kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: baseline; font-size: 13px; line-height: 1.45; }
  .kv dt { color: var(--fy-text-secondary); display: inline-flex; align-items: center; gap: 4px; }
  .kv dd { margin: 0; font-weight: 600; color: var(--fy-primary-600); text-align: right; }
  .info-btn { display: inline-grid; place-items: center; width: 18px; height: 18px; padding: 0; border: 0; border-radius: 50%; background: none; color: var(--fy-primary-300); cursor: pointer; }
  .info-btn svg { width: 13px; height: 13px; }
  .divider { height: 1px; background: var(--fy-border-subtle); border: 0; margin: 0; }
  .muted { color: var(--fy-text-secondary); }
  .small { font-size: 11px; line-height: 1.45; }
  .link { border: 0; background: none; padding: 4px; cursor: pointer; font: 600 13px/1.4 var(--fy-font); color: var(--fy-text-link); }
  .link--danger { color: var(--fy-error-700); }
  .pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font: 600 10px/1.6 var(--fy-font); letter-spacing: .02em; }
  .pill--ok { background: var(--fy-success-50); color: var(--fy-success-700); }
  .pill--warn { background: var(--fy-warning-50); color: var(--fy-warning-700); }
  .pill--err { background: var(--fy-error-50); color: var(--fy-error-700); }
  .pill--mute { background: var(--fy-neutral-100); color: var(--fy-neutral-500); }
  .banner { display: flex; gap: 10px; padding: 12px; border-radius: var(--fy-radius-md); font: 400 12px/1.5 var(--fy-font); }
  .banner svg { flex: none; width: 18px; height: 18px; margin-top: 1px; }
  .banner b { font-weight: 600; }
  .banner--info { background: var(--fy-success-50); color: var(--fy-primary-500); }
  .banner--warn { background: var(--fy-warning-50); color: var(--fy-warning-700); }
  .banner--err { background: var(--fy-error-50); color: var(--fy-error-700); }
  .acct { display: flex; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer; }
  .acct + .acct { border-top: 1px solid var(--fy-border-subtle); }
  .acct__text { flex: 1; min-width: 0; display: grid; gap: 2px; }
  .acct__name { font: 600 13px/1.3 var(--fy-font); color: var(--fy-primary-600); }
  .acct__meta { font: 400 11px/1.3 var(--fy-font); color: var(--fy-text-secondary); font-variant-numeric: tabular-nums; }
  .logo { display: grid; place-items: center; width: 34px; height: 34px; flex: none; border-radius: 50%; border: 1px solid var(--fy-border-subtle); background: #fff; font: 700 10px/1 var(--fy-font); }
  .grp-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 4px; font: 600 13px/1.3 var(--fy-font); color: var(--fy-primary-500); }
  .grp-head .link { font-size: 12px; }
  .steps { display: grid; gap: 14px; margin: 0; padding: 0; list-style: none; }
  .steps li { display: flex; align-items: center; gap: 10px; font: 400 13px/1.4 var(--fy-font); color: var(--fy-primary-100); }
  .steps li i { display: grid; place-items: center; width: 22px; height: 22px; flex: none; border-radius: 50%; border: 1.5px solid var(--fy-neutral-300); background: #fff; }
  .steps li i svg { width: 12px; height: 12px; }
  .steps li.done { color: var(--fy-primary-500); }
  .steps li.done i { border-color: var(--fy-primary-400); background: var(--fy-primary-400); color: #fff; }
  .steps li.now { color: var(--fy-primary-600); font-weight: 600; }
  .steps li.now i { border-color: var(--fy-primary-400); }
  .steps li.now i::after { content: ""; width: 10px; height: 10px; border: 2px solid var(--fy-primary-400); border-right-color: transparent; border-radius: 50%; animation: fy-spin .8s linear infinite; }
  .progress { height: 6px; border-radius: 999px; background: var(--fy-neutral-200); overflow: hidden; }
  .progress i { display: block; height: 100%; width: var(--p, 40%); border-radius: inherit; background: var(--fy-primary-400); transition: width .4s; }
  .seg { display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); padding: 3px; border-radius: 999px; background: var(--fy-neutral-100); }
  .seg button { height: 30px; border: 0; border-radius: 999px; background: none; cursor: pointer; font: 500 12px/1 var(--fy-font); color: var(--fy-primary-300); }
  .seg button[aria-pressed="true"] { background: var(--fy-white); color: var(--fy-primary-600); font-weight: 600; box-shadow: var(--fy-shadow-card); }
  .consent-card { display: grid; gap: 10px; padding: 14px; border-radius: var(--fy-radius-md); background: #fff; box-shadow: var(--fy-shadow-card); }
  .fiu { display: flex; align-items: center; gap: 10px; }
  .fiu__mark { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; background: var(--fy-primary-600); color: #fff; font: 700 15px/1 var(--fy-font); }
  .fiu__name { font: 600 14px/1.3 var(--fy-font); color: var(--fy-primary-600); }
  .fiu__sub { font: 400 11px/1.3 var(--fy-font); color: var(--fy-text-secondary); }
  .sup { font-size: 9px; vertical-align: super; color: var(--fy-primary-400); font-weight: 600; margin-left: 1px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 4px 10px; border-radius: 999px; background: var(--fy-neutral-100); font: 500 11px/1.4 var(--fy-font); color: var(--fy-primary-500); }
  .more { border-top: 1px dashed var(--fy-border-default); padding-top: 10px; }
  .more summary { list-style: none; cursor: pointer; display: flex; justify-content: center; gap: 4px; font: 600 12px/1.4 var(--fy-font); color: var(--fy-text-link); }
  .more summary::-webkit-details-marker { display: none; }
  .more[open] summary .chev { transform: rotate(180deg); }
  .more .kv { margin-top: 10px; }
  .decide { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .decide .fy-btn { height: 44px; font-size: 15px; }
  .fy-btn--reject { background: var(--fy-white); border: 1.5px solid var(--fy-primary-500); color: var(--fy-primary-600); }
  .fy-btn--approve { background: var(--fy-primary-500); color: #fff; }
  .decision { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px; border-radius: 8px; font: 600 13px/1 var(--fy-font); }
  .decision--ok { background: var(--fy-success-50); color: var(--fy-success-700); }
  .decision--no { background: var(--fy-error-50); color: var(--fy-error-700); }
  .listen { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid var(--fy-border-default); border-radius: 999px; background: #fff; cursor: pointer; font: 500 11px/1 var(--fy-font); color: var(--fy-primary-500); }
  .listen svg { width: 14px; height: 14px; }
  .tl { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; }
  .tl li { position: relative; padding: 0 0 16px 22px; font: 400 12px/1.45 var(--fy-font); color: var(--fy-text-secondary); }
  .tl li::before { content: ""; position: absolute; left: 4px; top: 6px; bottom: -6px; width: 2px; background: var(--fy-neutral-200); }
  .tl li:last-child::before { display: none; }
  .tl li::after { content: ""; position: absolute; left: 0; top: 3px; width: 10px; height: 10px; border-radius: 50%; background: var(--dot, var(--fy-primary-400)); box-shadow: 0 0 0 3px var(--fy-success-50); }
  .tl b { display: block; font-weight: 600; color: var(--fy-primary-600); }
  .tl time { font-size: 11px; color: var(--fy-primary-300); }
  .otp-mask .fy-otp__cell { -webkit-text-security: disc; }
  .vua { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 14px; border-radius: var(--fy-radius-md); background: var(--fy-primary-600); color: #fff; }
  .vua small { display: block; font: 400 10px/1.4 var(--fy-font); color: var(--fy-primary-100); letter-spacing: .04em; text-transform: uppercase; }
  .vua b { font: 600 16px/1.3 var(--fy-font); }
  .vua button { padding: 6px 10px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px; background: none; color: #fff; font: 500 11px/1 var(--fy-font); cursor: pointer; }
  .menu a { display: flex; align-items: center; gap: 12px; padding: 13px 14px; color: var(--fy-primary-600); text-decoration: none; font: 500 13px/1.3 var(--fy-font); cursor: pointer; }
  .menu a + a { border-top: 1px solid var(--fy-border-subtle); }
  .menu a > svg:first-child { width: 18px; height: 18px; color: var(--fy-primary-400); }
  .menu a span { flex: 1; }
  .menu a small { display: block; font-weight: 400; font-size: 11px; color: var(--fy-text-secondary); }
  .menu a .fy-chevron { width: 16px; height: 16px; color: var(--fy-neutral-400); }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; font: 500 13px/1.35 var(--fy-font); color: var(--fy-primary-600); }
  .toggle-row + .toggle-row { border-top: 1px solid var(--fy-border-subtle); }
  .toggle-row small { display: block; font-weight: 400; font-size: 11px; color: var(--fy-text-secondary); }
  .lock { display: flex; gap: 6px; align-items: center; justify-content: center; font: 400 10px/1.4 var(--fy-font); color: var(--fy-text-secondary); }
  .lock svg { width: 12px; height: 12px; }
  .masked { font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  .big-check { display: grid; place-items: center; width: 84px; height: 84px; border-radius: 50%; background: var(--fy-primary-400); color: #fff; box-shadow: 0 0 0 10px var(--fy-success-50); }
  .big-check svg { width: 40px; height: 40px; }
  .sheet-host { position: absolute; inset: 0; display: flex; align-items: flex-end; background: var(--fy-scrim); z-index: 5; }
  .sheet-host .fy-sheet { max-height: 86%; }
  .sheet-body { padding: 4px 16px 16px; display: grid; gap: 12px; overflow-y: auto; }
  .handle { width: 40px; height: 4px; border-radius: 4px; background: var(--fy-neutral-300); margin: 8px auto 0; }
  .meaning { display: grid; gap: 8px; padding: 12px; border-radius: var(--fy-radius-sm); background: var(--fy-bg-canvas); font: 400 12px/1.55 var(--fy-font); color: var(--fy-primary-500); }
  .meaning b { color: var(--fy-primary-600); }
  .tabs { display: flex; gap: 18px; border-bottom: 1px solid var(--fy-border-subtle); }
  .tabs button { padding: 10px 0; border: 0; border-bottom: 2px solid transparent; background: none; cursor: pointer; font: 500 13px/1 var(--fy-font); color: var(--fy-primary-300); }
  .tabs button[aria-pressed="true"] { border-bottom-color: var(--fy-primary-400); color: var(--fy-primary-600); font-weight: 600; }
  .stat3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat3 div { padding: 10px 8px; border-radius: 10px; background: var(--fy-neutral-100); text-align: center; }
  .stat3 small { display: block; font: 400 10px/1.3 var(--fy-font); color: var(--fy-text-secondary); }
  .stat3 b { font: 700 18px/1.3 var(--fy-font); color: var(--fy-primary-600); font-variant-numeric: tabular-nums; }
  .field-err { border-color: var(--fy-error-600) !important; }

  @media (max-width: 1180px) {
    .proto { grid-template-columns: 240px minmax(0, 1fr); }
    .why { grid-column: 1 / -1; position: static; }
  }
  @media (max-width: 760px) {
    .proto { grid-template-columns: minmax(0, 1fr); padding: 12px 16px; }
    .index { position: static; max-height: 260px; }
    .phone { height: 720px; }
    .topbar { padding: 10px 16px; }
    .topbar__brand span { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .progress i { transition: none; } }
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H4m6-6-6 6 6 6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-chev-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-chev-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-check" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m2.5 6.2 2.3 2.3 4.7-4.8"/></symbol>

/* ============================================================
 * Router + interactions
 * ============================================================ */
const byId = Object.fromEntries(S.map((s, i) => [s.id, { ...s, n: i }]));
let cur = 'redirect';
const hist = [];
const $ = (q, r = document) => r.querySelector(q);

function renderIndex() {
  let html = '', flow = '';
  S.forEach((s, i) => {
    if (s.flow !== flow) { flow = s.flow; html += `<h2>${flow}</h2>`; }
    html += `<button type="button" data-jump="${s.id}" aria-current="${s.id === cur}"><b>${String(i + 1).padStart(2, '0')}</b>${s.title}${s.isNew ? '<span class="tag-new">New</span>' : ''}</button>`;
  });
  $('#index').innerHTML = html;
}
function renderWhy() {
  const s = byId[cur];
  $('#why').innerHTML = `<span class="label">${s.isNew ? 'New screen' : 'Improved from your design'}</span>
    <h3>${s.title}</h3>
    <ul>${s.notes.map(n => `<li>${n}</li>`).join('')}</ul>
    <span class="label">ReBIT AA standard</span>
    <div class="clauses">${s.clauses.map(c => `<span>§${c}</span>`).join('')}</div>`;
  $('#crumb').innerHTML = `${s.flow} · <b>${s.title}</b> · ${s.n + 1} of ${S.length}`;
}
function go(id, push = true) {
  if (!byId[id]) return;
  if (push && id !== cur) hist.push(cur);
  cur = id;
  $('#phone').innerHTML = byId[id].render();
  wire($('#phone'));
  renderIndex(); renderWhy();
  try { history.replaceState(null, '', '#' + id); } catch (e) {}
}

function wire(root) {
  root.querySelectorAll('[data-go]').forEach(el => el.addEventListener('click', e => { if (el.disabled) return; e.preventDefault(); go(el.dataset.go); }));
  root.querySelectorAll('[data-back]').forEach(el => el.addEventListener('click', e => { e.preventDefault(); go(hist.pop() || 'redirect', false); }));
  root.querySelectorAll('[data-field]').forEach(el => el.addEventListener('click', e => { e.preventDefault(); showField(root, el.dataset.field); }));
  root.querySelectorAll('[data-group]').forEach(g => g.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.dataset.go) return;
    g.querySelectorAll(':scope > button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  }));
  // Account picker: nothing preselected; button counts selections.
  const countBtn = root.querySelector('[data-count]');
  const recount = () => { if (!countBtn) return; const n = root.querySelectorAll('[data-pick]:checked').length; countBtn.disabled = !n; countBtn.textContent = n ? `Continue with ${n} account${n > 1 ? 's' : ''}` : 'Select accounts to continue'; };
  root.querySelectorAll('[data-pick]').forEach(c => c.addEventListener('change', recount));
  root.querySelectorAll('[data-selectall]').forEach(b => b.addEventListener('click', e => {
    e.preventDefault(); const box = b.closest('[data-groupbox]'); const cs = [...box.querySelectorAll('[data-pick]')]; const all = cs.every(c => c.checked);
    cs.forEach(c => c.checked = !all); b.textContent = all ? 'Select all' : 'Clear'; recount();
  }));
  // Separate decision per consent.
  const gate = root.querySelector('[data-allgate]');
  root.querySelectorAll('[data-decision-card]').forEach(card => card.querySelectorAll('[data-decide]').forEach(b => b.addEventListener('click', () => {
    const ok = b.dataset.decide === 'ok';
    card.querySelector('.decide').outerHTML = `<div class="decision decision--${ok ? 'ok' : 'no'}">${ok ? '✓ Approved' : '✕ Rejected'} <button class="link small" data-undo style="margin-left:6px">Change</button></div>`;
    card.querySelector('[data-undo]').addEventListener('click', () => go('multi', false));
    const left = root.querySelectorAll('[data-decision-card] .decide').length;
    if (gate) { gate.disabled = !!left; gate.textContent = left ? 'Decide on both to continue' : 'Confirm decisions'; }
  })));
  const gc = root.querySelector('[data-gate-check]'), gb = root.querySelector('[data-gate-btn]');
  if (gc && gb) gc.addEventListener('change', () => gb.disabled = !gc.checked);
  root.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', () => {
    navigator.clipboard?.writeText(b.dataset.copy).then(() => b.textContent = 'Copied', () => b.textContent = 'Copy failed');
  }));
  root.querySelectorAll('[data-speak]').forEach(b => b.addEventListener('click', () => {
    const t = 'Finny requests consent. Purpose: personal financial planning. Start 8 October 2026, expiry 8 October 2027. Periodic fetch, once a month, last 12 months of deposits, mutual funds and equities.';
    try { speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance(t)); b.innerHTML = ic('mic') + 'Playing…'; } catch (e) { b.textContent = 'Audio unavailable'; }
  }));
  root.querySelectorAll('[data-otp]').forEach(row => { const c = [...row.querySelectorAll('input')];
    c.forEach((el, i) => { el.addEventListener('input', () => { el.value = el.value.replace(/\D/g, '').slice(-1); if (el.value) c[i + 1]?.focus(); });
      el.addEventListener('keydown', e => { if (e.key === 'Backspace' && !el.value) c[i - 1]?.focus(); }); }); });
}

function showField(root, k) {
  const [label, meaning, ex] = FIELDS[k];
  const extra = k === 'ctype' ? Object.entries(CTYPE).map(([a, b]) => `<span><b>${a}:</b> ${b}</span>`).join('') : `<span><b>In this request:</b> ${ex}</span>`;
  const host = document.createElement('div');
  host.className = 'sheet-host';
  host.innerHTML = `<div class="fy-sheet" role="dialog" aria-label="${label}"><div class="handle"></div>
    <div class="fy-sheet__head fy-sheet__head--plain" style="padding-bottom:4px"><button class="fy-icon-btn fy-sheet__close" aria-label="Close">${ic('close')}</button><p class="fy-sheet__title" style="font-size:20px">${label}</p></div>
    <div class="sheet-body"><div class="meaning"><span>${meaning}</span>${extra}</div><button class="fy-btn fy-btn--secondary">Got it</button></div></div>`;
  const close = () => host.remove();
  host.addEventListener('click', e => { if (e.target === host) close(); });
  host.querySelectorAll('button').forEach(b => b.addEventListener('click', close));
  root.firstElementChild.appendChild(host);
  host.querySelector('button').focus();
}

/* Gallery: every screen, static, grouped by flow. */
function renderGallery() {
  const flows = [...new Set(S.map(s => s.flow))];
  $('#gallery').innerHTML = `<div><h2>All ${S.length} screens</h2><p class="lede">Static view of every screen, grouped by flow. Switch to Prototype to click through.</p></div>` +
    flows.map(f => `<section><h2 style="font-size:17px">${f}</h2><div class="gallery__row">${S.filter(s => s.flow === f).map(s => `<div class="gallery__item"><div class="phone">${s.render()}</div><div class="gallery__cap"><b>${String(byId[s.id].n + 1).padStart(2, '0')}</b>${s.title}${s.isNew ? ' · <span style="color:var(--fy-warning-700)">New</span>' : ''}</div></div>`).join('')}</div></section>`).join('');
}

document.addEventListener('click', e => { const j = e.target.closest('[data-jump]'); if (j) { hist.length = 0; go(j.dataset.jump); } });
$('#prev').addEventListener('click', () => { const i = byId[cur].n; if (i > 0) go(S[i - 1].id); });
$('#next').addEventListener('click', () => { const i = byId[cur].n; if (i < S.length - 1) go(S[i + 1].id); });
const setMode = (all) => {
  $('#mode-proto').setAttribute('aria-pressed', String(!all)); $('#mode-all').setAttribute('aria-pressed', String(all));
  $('#proto').hidden = all; $('#gallery').hidden = !all;
  if (all && !$('#gallery').innerHTML) renderGallery();
};
$('#mode-proto').addEventListener('click', () => setMode(false));
$('#mode-all').addEventListener('click', () => setMode(true));

const start = (location.hash || '').slice(1);
go(byId[start] ? start : 'redirect', false);
</script>
